# Согласованный вид директив снятия, хранения и записи.
#
# Это не рабочий конфиг, а выжимка: одна строка на решение, рядом причина.
# Нормативное описание -- docs/configuration.md, состояние кода --
# nginx/module/directives.md.

http {
    # --- дедлайн и исключения ----------------------------------------------
    #
    # Бюджет фазы -- один вопрос, исход без вердикта -- другой, и с 09.09.2026
    # они разведены: waf_deadline называет срок, waf_exception -- что делать,
    # когда вердикта нет. Класс необязателен: строка без него задаёт все.
    # Умолчания: timeout, absent и body -- deny, bus -- pass.
    waf_deadline  request 700ms;
    waf_exception request deny;
    waf_exception request bus pass;

    # deny умеет назвать запись каталога: у сбоя своей нет, и без неё
    # клиент получает голый 503.
    waf_exception response timeout deny response=error;

    waf_shm_zone waf 8m;

    # --- предел тела -------------------------------------------------------
    #
    # Размер и политика на превышение тоже читаются вместе.
    # block -- отказать, trim -- разместить префикс и пометить локатор,
    # pass -- пропустить без проверки тела.
    waf_body_limit 10m block;

    # --- горячий обменник -----------------------------------------------------
    #
    # Один на конфигурацию, имени нет: маршруту выбирать не из чего.
    waf_store driver=redis url=redis://redis:6379
              ttl=15s retain_ttl=5m max=8m pool=2
              connect_timeout=200ms op_timeout=200ms;

    # --- что видят инспекторы ----------------------------------------------
    #
    # Ось оператора: заявку инспектора в needs= она ограничивает сверху.
    waf_capture request headers args body;

    # --- срез в записи аудита ----------------------------------------------
    #
    # Объект называется первым словом. Первый размер -- бюджет секции,
    # второй -- потолок на одну пару.
    #
    # Заданное превью -- требование извлечь: названный объект окажется в
    # записи, даже если его не просит ни один инспектор. Поэтому умолчание
    # у всех трёх -- off, и force больше не нужен.
    #
    # Потолок на пару: сначала пишется имя. Имя занимает больше половины
    # потолка -- пара выбрасывается целиком, потому что имя такой длины само
    # по себе улика, а обрезок значения при нём ничего не добавит. Имя
    # уложилось -- значение урезается до остатка по границе символа UTF-8 и
    # помечается урезанным.
    waf_preview headers=8k/1k args=4k/1k body=10k;
    waf_preview headers allow=*;
    # у тела потолка на пару нет: body=10k, не body=10k/1k

    # --- что переживёт запрос ----------------------------------------------
    #
    # Область первым словом: пока только request, response отвергается при
    # nginx -t до появления фазы ответа.
    #
    # Строка настраивает только названные в ней объекты, строки уровня
    # складываются. Так размер и ttl= называются объекту отдельно, не заставляя
    # переписывать остальные; waf_archive request none очищает уровень.
    waf_archive request headers args ttl=15s;
    waf_archive request body=8k      ttl=15s;

    # размер на объекте режет агент, а не модуль: в обменнике объект лежит целиком,
    # потому что его мог попросить инспектор, и отдавать ему меньше просимого
    # ради настройки архива модуль не вправе.
}

# --- как это доезжает до ClickHouse и S3 -----------------------------------
#
# Агент снимает объект с обменника и решает три вещи.
#
# Объект требовался, но оказался пуст -- в S3 не пишется ничего, в записи
# стоит признак empty. Иначе пустая строка в архиве и отсутствие объекта
# выглядят одинаково.
#
# Объект урезан по размеру на объекте -- в записи стоит признак усечения. Читатель не
# должен принимать префикс за оригинал.
#
# Срок хранения в записи есть всегда: без него непонятно, придёт ли по ссылке
# что-нибудь завтра.
#
# Очередь архивации переполнена -- объект не пишется, локатор едет с причиной
# overload. Это отличается от archive_error: там PUT не удался, здесь его не
# пробовали. Запись публикуется в обоих случаях -- теряется полезная нагрузка,
# не событие.
