# API: контур, снимок, волны, страницы. Тело не читаем.

load_module modules/ngx_http_waf_module.so;

events {}

http {
    # nginx не примет тело больше 1m — иначе 413 до модуля
    client_max_body_size 1m;
    # модуль не читает больше 1m; крупнее — отказ, не тихий пропуск
    waf_body_limit 1m block;
    # узел во флоте: инбокс, ключи redis, аудит
    waf_node_id edge-07;
    # шина для инспекторов; без неё реестр не грузится
    waf_bus nats://nats-1:4222,nats-2:4222,nats-3:4222;
    # unix dgram агенту: аудит, archive, preview
    waf_agent_socket /run/waf/verdict.sock;
    # redis: объекты инспекторам и агенту, один на контур
    waf_store driver=redis url=redis://redis:6379
              ttl=30s retain_ttl=5m max=8m pool=4;
    # breaker и слоты списков живут здесь
    waf_shm_zone waf 32m;

    # 403 правило / список
    waf_deny_response blocked status=403 page=@waf_deny;
    # 403 порог счёта — отдельная страница, чаще ложные
    waf_deny_response suspicious status=403 page=@waf_deny;
    # 429 частота
    waf_deny_response too_many status=429 page=@waf_deny;
    # нет имени в ответе — эта запись
    waf_deny_response_default blocked;

    # кто слушает шину: мягкий профиль адреса
    waf_inspector allow_ip subject=waf.req.ip profile=allow;
    # sqli
    waf_inspector sqli subject=waf.req.sqli;
    # crs, жёсткий профиль
    waf_inspector modsec subject=waf.req.modsec profile=strict;
    # капча, вес 0 — сам не скорит
    waf_inspector challenge subject=waf.req.chal;

    # ja3 в сообщение инспекторам, не в local_check
    waf_var ja3 $http_x_ja3;

    # hdr/args на всех; тело не снимаем — дешёвые волны
    waf_capture request headers=64k args=64k;
    # cookie не светим инспекторам
    waf_capture request headers mask=authorization,cookie;
    # session не кладём в redis
    waf_capture request args deny=session;
    # в S3 hdr/args только при deny, на 30 дней
    waf_archive request headers args ttl=30d when=deny;
    # в S3 оригинал headers, тот же 64k
    waf_archive request reload headers=capture;
    # срез в clickhouse, пара не длиннее 1k
    waf_preview request headers=30k/1k args=8k/1k;
    # ключ в запись аудита не пишем
    waf_preview request headers deny=x-api-key;

    # 50ms на все волны request; не дождались — отказ
    waf_deadline request 50ms;
    waf_exception request timeout deny;
    # нет подписчика — дыра в деплое, не ждать дедлайн
    waf_exception request absent deny;
    # шина лежит — лучше отдать приложение
    waf_exception request bus pass;
    # redis не принял тело — не пускать непроверенное
    waf_exception request body deny;
    # первый deny замыкает, страницы могут гонять
    waf_deny_mode request fast;
    # порог выкл: копим счёт в аудит, не режем
    waf_score_deny request 0;

    server {
        listen 8080;
        server_name api.example.com;

        # держим 403, иначе try_files даст 200
        error_page 403 =403 @waf_deny;
        # то же для 429
        error_page 429 =429 @waf_deny;

        # страница: ssi подставит $waf_ray / $waf_deny_name
        location @waf_deny {
            # модуль здесь не нужен, иначе петля
            waf off;
            # подстановка переменных в html
            ssi on;
            # ssi и для не-html
            ssi_types *;
            # стандартные шаблоны
            root /usr/share/waf/pages;
            # файл по имени записи, иначе blocked
            try_files /$waf_deny_name.html /blocked.html;
        }

        # контур включён
        waf on;

        # дешёвый allow, не ждём дорогих
        waf_inspect request allow_ip wave=0 timeout=5ms;
        # sqli и crs параллельно
        waf_inspect request sqli wave=1 timeout=15ms weight=1.0;
        # crs может быть долгим
        waf_inspect request modsec wave=1 timeout=1000ms;
        # челлендж после счёта, сам не скорит
        waf_inspect request challenge wave=2 timeout=10ms weight=0;

        # приложение
        location / {
            proxy_pass http://app;
        }
    }
}
