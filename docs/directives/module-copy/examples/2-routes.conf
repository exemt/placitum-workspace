# маршруты: свой набор на location заменяет серверный, не дополняет.

load_module modules/ngx_http_waf_module.so;

events {}

http {
    # потолок тела nginx
    client_max_body_size 1m;
    # потолок чтения модуля
    waf_body_limit 1m block;
    # шина
    waf_bus nats://nats:4222;
    # агент
    waf_agent_socket /run/waf/verdict.sock;
    # redis
    waf_store driver=redis url=redis://redis:6379 ttl=30s retain_ttl=5m max=8m;
    # shm
    waf_shm_zone waf 32m;
    # страница отказа
    waf_deny_response blocked status=403 page=@waf_deny;
    # умолчание каталога
    waf_deny_response_default blocked;

    # мягкий ip
    waf_inspector allow_ip subject=waf.req.ip profile=allow;
    # жёсткий ip, тот же процесс
    waf_inspector strict_ip subject=waf.req.ip profile=strict;
    # sqli
    waf_inspector sqli subject=waf.req.sqli;
    # crs
    waf_inspector modsec subject=waf.req.modsec profile=strict;
    # капча
    waf_inspector challenge subject=waf.req.chal;
    # json, request и response одним именем
    waf_inspector json subject=waf.req.json;

    # hdr/args везде, где не перекроем
    waf_capture request headers=64k args=64k;
    # 50ms request
    waf_deadline request 50ms;
    waf_exception request timeout deny;
    # нет подписчика — отказ
    waf_exception request absent deny;
    # шина лежит — пропуск
    waf_exception request bus pass;

    server {
        listen 8080;
        server_name www.example.com;

        # статус страницы
        error_page 403 =403 @waf_deny;

        # html отказа
        location @waf_deny {
            # без модуля, иначе петля
            waf off;
            # подстановка $waf_ray
            ssi on;
            # ssi и для не-html
            ssi_types *;
            # стандартные страницы
            root /usr/share/waf/pages;
            # файл по имени записи
            try_files /$waf_deny_name.html /blocked.html;
        }

        # защита по умолчанию
        waf on;
        # волна 0: дешёвый ip
        waf_inspect request allow_ip wave=0 timeout=5ms;
        # волна 1: sqli параллельно crs
        waf_inspect request sqli wave=1 timeout=15ms;
        # crs дольше, тот же номер
        waf_inspect request modsec wave=1 timeout=1000ms;
        # после счёта: капча, вес 0
        waf_inspect request challenge wave=2 timeout=10ms weight=0;

        # проба балансировщика: модуль не трогает
        location = /health {
            waf off;
            return 200;
        }

        # статика: никого не опрашиваем и ничего не кладём в контур
        location /static/ {
            # иначе inherit headers/args (и тело, если появится на сервере)
            waf_capture request none;
            # иначе inherit preview
            waf_preview request none;
            # волн нет
            waf_inspect request none;
            alias /var/www/static/;
        }

        # api: свой request, без modsec и challenge; sqli только смотрит
        location /api/ {
            # тело 4k инспекторам; hdr/args остаются с сервера
            waf_capture request body=4k;
            # доступность важнее: не дождались — пропуск
            waf_deadline request 30ms;
            waf_exception request timeout pass;
            # свой набор, серверный не действует
            waf_inspect request allow_ip wave=0 timeout=5ms;
            # passive: в лог, не гейтит, дедлайн не двигает
            waf_inspect request sqli wave=1 timeout=15ms mode=passive;
            proxy_pass http://api;
        }

        # жёсткий ip, тот же subject что allow_ip
        location /strict/ {
            waf_inspect request strict_ip wave=0 timeout=5ms;
            waf_inspect request sqli wave=1 timeout=15ms;
            proxy_pass http://app;
        }

        # логин: челлендж имеет куда редиректить
        location /login {
            # локальный путь капчи
            waf_redirect_allow /waf/captcha;
            # абсолютный хост челленджа
            waf_redirect_allow https://chal.example.com/c/;
            # поддомены, не сам chal.example.com
            waf_redirect_allow https://*.chal.example.com/;
            # cookie челленджа с secure; без tls нужен off
            waf_cookie_defaults secure=on http_only=on same_site=Lax;
            # только капча, после ip
            waf_inspect request allow_ip wave=0 timeout=5ms;
            # капча одна в своей волне
            waf_inspect request challenge wave=1 timeout=10ms weight=0;
            # приложение
            proxy_pass http://app;
        }

        # кабинет: json на request и на response, волны фаз свои
        location /account/ {
            waf_inspect request allow_ip wave=0 timeout=5ms;
            waf_inspect request json wave=1 timeout=1000ms;
            # фазы ответа ещё нет; строка есть, чтобы не забыть ось
            waf_inspect response json wave=0 timeout=800ms;
            # нет json на ответе — не валить кабинет
            waf_exception response absent pass;
            proxy_pass http://app;
        }

        # всё остальное — серверный набор
        location / {
            proxy_pass http://app;
        }
    }
}
