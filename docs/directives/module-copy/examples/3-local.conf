# локальный слой до шины: office, бан, ua, токен в волны, автобан.

load_module modules/ngx_http_waf_module.so;

events {}

http {
    # потолок тела
    client_max_body_size 1m;
    waf_body_limit 1m block;
    # шина: active-списки и инспекторы
    waf_bus nats://nats:4222;
    waf_agent_socket /run/waf/verdict.sock;
    waf_store driver=redis url=redis://redis:6379 ttl=30s retain_ttl=5m max=8m;
    # зона раньше любых dataset / check / rate
    waf_shm_zone waf 32m;
    # пакеты и снапшоты активных наборов -- внутренний Redis (docs/spec.md репозитория keeper)
    waf_sets_store driver=redis url=redis://redis-internal:6379 pool=2 max=512m get_timeout=30s;

    # 403 список
    waf_deny_response blocked status=403 page=@waf_deny;
    # 403 ua
    waf_deny_response suspicious status=403 page=@waf_deny;
    # 429 rate
    waf_deny_response too_many status=429 page=@waf_deny;
    waf_deny_response_default blocked;

    # инспекторы после локального слоя
    waf_inspector allow_ip subject=waf.req.ip profile=allow;
    waf_inspector sqli subject=waf.req.sqli;

    # офис в конфиге, смена через reload
    waf_local_dataset office type=cidr limit=1024 internal;
    # 10/8
    waf_local_dataset office 10.0.0.0/8;
    # rfc1918 остальное
    waf_local_dataset office 192.168.0.0/16 172.16.0.0/12;
    # бан с контроллера, overlay 5m
    waf_local_dataset blocklist type=cidr limit=100000 ttl=5m active;
    # плохие ua, точное сравнение
    waf_local_dataset badua type=string limit=65536 active;
    # токены: не allow, а сразу в волны
    waf_local_dataset tokens type=string limit=10000 active;

    # hdr/args
    waf_capture request headers=64k args=64k;
    # 50ms
    waf_deadline request 50ms;
    waf_exception request timeout deny;
    waf_exception request absent deny;
    waf_exception request bus pass;

    server {
        listen 8080;
        server_name edge.example.com;

        error_page 403 =403 @waf_deny;
        error_page 429 =429 @waf_deny;

        location @waf_deny {
            # без модуля
            waf off;
            # $waf_ray в шаблон
            ssi on;
            # ssi для любого типа
            ssi_types *;
            # стандартные страницы
            root /usr/share/waf/pages;
            # файл по имени записи
            try_files /$waf_deny_name.html /blocked.html;
        }

        waf on;

        # офис выше бана: даже в blocklist — мимо волн
        waf_local_check office $binary_remote_addr action=allow;
        # токен: остальные check/rate не смотрим, идём в inspect
        waf_local_check tokens $http_x_api_key action=wave;
        # бан с контроллера
        waf_local_check blocklist $binary_remote_addr action=block
                        response=blocked;
        # ua из списка — 403
        waf_local_check badua $http_user_agent action=block
                        response=suspicious;
        # 5 r/s, этот запрос 429, ключ в overlay blocklist на 5m
        waf_local_rate $binary_remote_addr rate=5r/s burst=5
                       response=too_many list=blocklist;

        # волны только если локальный слой не закрыл и не allow
        waf_inspect request allow_ip wave=0 timeout=5ms;
        waf_inspect request sqli wave=1 timeout=15ms;

        location / {
            proxy_pass http://app;
        }
    }
}
