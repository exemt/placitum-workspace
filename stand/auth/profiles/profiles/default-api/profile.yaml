# Профиль-спутник для путей API: тот же источник, что у последней калитки
# маршрута (default-totp), и пустые redirect_methods -- 401 всем без сессии,
# даже на навигационном GET. Сессию полной цепочки он принимает: источник
# один, и токен с его штампом здесь свой.
#
# Формы у спутника нет и не бывает: форма принадлежит источнику, а профиль
# только проверяет выданное.

mode: enforce

source: default-totp

gate:
  # Пусто -- на форму не уводим никого: 401 с телом из каталога отказов
  # честнее редиректа, который XHR всё равно не переживёт.
  redirect_methods: []
  deny_response: auth_required
