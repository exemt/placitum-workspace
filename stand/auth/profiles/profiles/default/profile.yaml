# Профиль калитки по умолчанию: пускаем всякого, кто вошёл через источник
# default. Профиль -- это политика одного маршрута: режим, условия допуска и
# правила приёма чужих просьб. Сам вход (провайдер, форма, сессии) живёт в
# источнике -- ../../sources/default.
#
# Профиль выбирается тегом profile= записи waf_inspector и приезжает
# инспектору в route.profile. Правка файла подхватывается без рестарта:
# процесс опрашивает отпечаток каталога раз в секунду.

mode: enforce

source: default

gate:
  # Всё, чего здесь нет, получает 401: редирект на не-идемпотентном методе
  # теряет тело запроса.
  redirect_methods: [GET, HEAD]
  redirect_status: 303
  # Имя записи каталога waf_deny_response. Код и страницу отдаёт nginx.
  deny_response: auth_required
  # GET без text/html в Accept -- это XHR, и HTML формы ему не поможет.
  html_only: true
  # Допуск по группам здесь не объявлен -- достаточно самого факта входа.
  # Закрытой зоне заводят соседний профиль с тем же source: и списком groups:
  # второй раз входить не нужно, сессия общая.

# Просьбы соседей. Единственное место, где чужое действие что-то значит:
# без правила просьба видна только в аудите. Reauth -- ужесточение, его можно
# слушать от всех; skip ослабляет и требует имени отправителя.
trigger:
  # Сессия моложе пяти минут просьбу reauth не видит: только что вошедшего не
  # гоняют на форму по кругу -- отправитель шлёт действие на каждом запросе и
  # не знает, что вход уже случился.
  reauth_after: 5m
  prior:
    - from: "*"
      accept: [reauth]
