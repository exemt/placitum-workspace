# Наблюдение: калитка отвечает allow всегда и пишет в аудит, что решила бы в
# enforce (engine.would и engine.reason события kind=inspector).
#
# Это единственный способ выкатить второй фактор на живой маршрут, не заперев
# за ним пользователей: сначала смотрят распределение would по реальному
# трафику, потом переключают mode.
#
# Источник назван настоящий: наблюдатель открывает живые сессии этого
# пространства и показывает, кого enforce пропустил бы, а кого увёл на форму.

mode: observe

source: default

gate:
  deny_response: auth_required
