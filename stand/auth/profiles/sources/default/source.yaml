# Источник входа по умолчанию: логин с паролем из списка контура.
#
# Источник -- это всё про сам вход: провайдер, форма, сессии, лимит попыток.
# Кто и куда с этой сессией допущен, решают профили-калитки (../../profiles),
# ссылаясь сюда ключом source:. Профили одного источника принимают сессии
# друг друга; сессии чужого источника не значат здесь ничего -- токен несёт
# имя источника (iss), и совпадение имён кук дырой не становится.
#
# Правка файла подхватывается без рестарта: процесс опрашивает отпечаток
# каталога раз в секунду.

login:
  # Путь обязан совпадать с location в nginx и входить в waf_redirect_allow.
  # Угадать его нельзя, поэтому умолчания у него нет. Форма одна на источник:
  # второй формы у пространства сессий не бывает.
  uri: /waf/login
  title: "Требуется вход"
  note: "Доступ к приложению защищён вторым фактором контура."

session:
  # Имя куки -- на источник, и другому источнику эту куку не отдадут: реестр
  # отвергает поколение с совпадающими. Умолчание -- waf_sid_<имя источника>.
  cookie: waf_sid_default
  ttl: 8h
  # Тихое продление на навигационном GET. Скользящего срока без редиректа быть
  # не может: на allow модуль cookie не ставит.
  renew_after: 1h
  bind: [subnet, ua]
  subnet: { v4: 24, v6: 64 }

ticket:
  ttl: 10m

upstream:
  user: X-WAF-User
  groups: X-WAF-Groups
  method: X-WAF-Auth
  # Удостоверение приложению в cookie. Заголовки ставит вердикт allow, поэтому
  # на быстром пути по активному списку их не будет -- инспектора там не
  # спрашивают. Cookie этим не связана: её ставит форма один раз при входе.
  #
  # Запечатана отдельным ключом (WAF_AUTH_APP_KEY_FILE): приложение её
  # открывает, клиент -- нет.
  cookie: waf_id
  ttl: 0

# Активного списка у первого источника цепочки нет намеренно: запись в списке
# означала бы «пароль введён», а быстрый путь пропускал бы второй фактор.
# Список объявляет последний источник маршрута -- sources/default-totp.

# Один источник -- один способ входа. Второй фактор (TOTP) -- отдельный
# источник default-totp: он узнаёт личность из сессии этого (identity.from).
provider: local

providers:
  local:
    users: users.yaml

lockout:
  attempts: 5
  window: 10m
  lock: 15m

# Roster общий на процесс: источники обязаны объявлять его одинаково, иначе
# загрузка отвергает поколение.
roster:
  store: redis
  prefix: "auth:"
  revoke_refresh: 2s
