# Прежние две стороны -- два правила. Порядок тот же, что был зашит: белый
# смотрят раньше чёрного, потому что исключение обязано побеждать запрет.
rules:
  - set: private
    action: allow

  # Живой набор: пока снапшот не приехал, правило просто не совпадает.
  - set: banned
    action: deny
    response: blocked

  # Адрес из тестового "tor" никого не блокирует: инспектор адреса про него
  # рассказывает, а решение принимает капча -- по своему профилю.
  #
  # Условие здесь -- сырой список, а не составной набор: вердикта строка не
  # выносит, и выражение над сырьём ей ни к чему. Имя списка в дереве образа
  # -- имя файла в lists/; в поколении с контроллера на его месте uuid.
  - dataset: tor
    action: request
    to: captcha
    do: challenge
    apply: request
    code: IP_GREYLIST

  - set: blocked
    action: deny
    response: blocked

  - set: ru
    action: deny
    response: blocked

default: allow
