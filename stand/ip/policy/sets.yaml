# Составные наборы: выражение над сырьём. Решения здесь нет -- набор отвечает
# только на вопрос "кто это", а что с этим делать, говорит профиль.
#
# Живых наборов (live:) в дереве образа нет: их состав приезжает шиной, и
# объявляет их поколение с контроллера вместе с live.yaml.

# Служебные и частные сети.
private:
  lists: [allowlist]

# Документационные сети RFC 5737 -- тестовый запрет.
blocked:
  lists: [blocklist]

# Офис: он же вычитается из страновых наборов.
office:
  lists: [office]

# Всё, кроме офиса. Прежний профиль admin выражался inverse на стороне.
not-office:
  lists: [office]
  inverse: true

# Россия целиком.
ru:
  countries: [ru]

# Россия без офиса: 5.8.8.1 проходит, остальная РФ -- нет.
ru-ext:
  countries: [ru]
  exclude:
    lists: [office]

# Живой набор: состав приезжает шиной. До снапшота -- промах, а не отказ.
banned:
  live: [e2e-banned-0000-4000-8000-000000000001]

# Тестовый "tor": повод для капчи, а не отказ.
tor:
  lists: [tor]

# Большой список: t/ip-large.sh подменяет us.txt выгрузкой GeoLite2.
us:
  lists: [us]

heavy-allow:
  lists: [allow]
